name: iOS preview
on:
  push:
    paths: ['app-ios/**', 'protocol/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['app-ios/**', 'protocol/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Test protocol core
        working-directory: app-ios
        run: swift test
      - name: Resolve pinned LiveKit dependencies
        working-directory: app-ios
        run: xcodebuild -resolvePackageDependencies -project AgentRing.xcodeproj -scheme AgentRing -onlyUsePackageVersionsFromResolvedFile
      - name: Build unsigned simulator app
        working-directory: app-ios
        run: xcodebuild -project AgentRing.xcodeproj -scheme AgentRing -destination 'generic/platform=iOS Simulator' -derivedDataPath build -disableAutomaticPackageResolution CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build
      - name: Package simulator app
        working-directory: app-ios
        run: ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Debug-iphonesimulator/AgentRing.app AgentRing-simulator.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AgentRing-iOS-simulator
          path: app-ios/AgentRing-simulator.zip
          retention-days: 7
